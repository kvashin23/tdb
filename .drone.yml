# push в test → песочница test.devnuts (devenv-ci). push в main → tdbngs.ru на nuts-agency.ru (drone-static).
# Секрет deploy_key — приватный ключ drone-deploy (общий на пространство dk).
kind: pipeline
type: docker
name: песочница

trigger:
  branch: [test]
  event: [push, custom]

steps:
  - name: devenv up
    image: drone/git
    pull: if-not-exists
    environment:
      DEPLOY_KEY: { from_secret: deploy_key }
    commands:
      - (umask 077; printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > /tmp/deploy_key) && ssh-keygen -lf /tmp/deploy_key
      - ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@62.109.20.26 tdb "$DRONE_BRANCH"

---
kind: pipeline
type: docker
name: боевой

trigger:
  branch: [main]
  event: [push, custom]

steps:
  - name: выкладка на nuts-agency
    image: drone/git
    pull: if-not-exists
    environment:
      DEPLOY_KEY: { from_secret: deploy_key }
    commands:
      - (umask 077; printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > /tmp/deploy_key) && ssh-keygen -lf /tmp/deploy_key
      - ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 tdbngs@82.146.35.211 tdb
